
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Injection Lab</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: url('Code_Injection.png') no-repeat center center fixed;
            background-size: cover;
            backdrop-filter: blur(5px);
        }
        .semitransparent {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
        }
        .progress-container {
            position: fixed;
            top: 10px;
            width: 90%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="progress-container">
        <div class="progress">
            <div id="progress-bar" class="progress-bar progress-bar-striped bg-info" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
        </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">HTML Injection Lab</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="low.html">Low Security</a></li>
                    <li class="nav-item"><a class="nav-link" href="medium.html">Medium Security</a></li>
                    <li class="nav-item"><a class="nav-link" href="high.html">High Security</a></li>
                    <li class="nav-item"><a class="nav-link" href="very_high.html">Very High Security</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container semitransparent mt-5">
        <h1>Medium Security - Reflected HTML Injection with Filtering</h1>
        <p>This page attempts to filter malicious inputs, but it is still vulnerable.</p>
        <form method="GET">
            <input type="text" name="input" class="form-control" placeholder="Type something...">
            <button class="btn btn-warning mt-2">Submit</button>
        </form>
        <hr>
        <h3>Output:</h3>
        <p id="output"></p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const userInput = params.get('input');
        if (userInput) {
            const sanitizedInput = userInput.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            document.getElementById('output').innerHTML = sanitizedInput; // Basic sanitization
        }
    </script>
    
    <footer class="text-center mt-5">
        <p>Created by <a href="https://www.linkedin.com/in/anuja-panchariya" target="_blank">Anuja Panchariya</a> | <a href="https://github.com/annyy17" target="_blank">GitHub</a></p>
    </footer>
</body>
</html>
