<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Injection Lab</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-image: url('hackify/Code_Injection.png');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            position: relative;
            color: #fff;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
        }

        .progress-container {
            margin-top: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10; /* Ensure the footer is on top */
        }

        footer a {
            color: #0e76a8;
            text-decoration: none;
            margin: 0 10px;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1>Welcome to the HTML Injection Lab</h1>
        <p>Select a level to start:</p>
        <div class="btn-group" role="group">
            <body style="background-image: url('xx.jpg'); background-size: cover; background-repeat: no-repeat;">

            <a href="low.html" class="btn btn-danger" onclick="updateProgress('low')">Low</a>
            <a href="medium.html" class="btn btn-warning" onclick="updateProgress('medium')">Medium</a>
            <a href="high.html" class="btn btn-success" onclick="updateProgress('high')">High</a>
            <a href="very_high.html" class="btn btn-secondary" onclick="updateProgress('very_high')">Very High</a>
        </div>

        <div class="progress-container mt-4">
            <div class="progress">
                <div class="progress-bar" role="progressbar" style="width: 0%;" id="progress-bar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
            </div>
        </div>
    </div>

    <footer>
        <p>Connect with me:</p>
        <a href="https://www.linkedin.com/in/anuja-panchariya" target="_blank">LinkedIn</a>
        <a href="https://github.com/annyy17" target="_blank">GitHub</a>
    </footer>

    <script>
        function updateProgress(level) {
            const levels = { "low": 25, "medium": 50, "high": 75, "very_high": 100 };
            const progressBar = document.getElementById("progress-bar");
            const progress = levels[level];
            progressBar.style.width = progress + "%";
            progressBar.setAttribute("aria-valuenow", progress);
            progressBar.textContent = progress + "%";
        }
    </script>
</body>
</html>
